<!DOCTYPE html>

<title>LOGISTIXX Unfallsimulator</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#eceff1;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

#header{background:#0d1b4b;border-bottom:4px solid #ff6d00;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px}
#company{color:#fff;font-size:17px;font-weight:800;letter-spacing:1.5px}
#subtitle{color:#8fa0cc;font-size:10px;margin-top:2px}
#header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#badge{background:#c62828;color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:4px;letter-spacing:.8px;white-space:nowrap}
#restart-btn{background:transparent;color:#8fa0cc;border:1px solid #8fa0cc;border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit}
#restart-btn:active{background:rgba(255,255,255,.08)}

#notruf-banner{display:none;background:#1b5e20;color:#fff;text-align:center;padding:9px 14px;font-weight:800;font-size:15px;flex-shrink:0;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{background:#1b5e20}50%{background:#2e7d32}}

#chat-area{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.bubble{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.55;word-wrap:break-word}
.b-bot{background:#fff;color:#1a1a2e;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.b-user{background:#0d1b4b;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.b-warn{background:#fff8e1;color:#6d4c00;border-left:4px solid #ffa000;align-self:flex-start;border-radius:10px;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.b-ok{background:#e8f5e9;color:#1b5e20;border-left:4px solid #43a047;align-self:flex-start;border-radius:10px;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.b-err{background:#fce4ec;color:#880e4f;border-left:4px solid #e91e63;align-self:flex-start;border-radius:10px;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.b-konsequenz{background:#fbe9e7;color:#b71c1c;border-left:4px solid #e53935;align-self:flex-start;border-radius:10px;border-bottom-left-radius:4px;box-shadow:0 2px 5px rgba(229,57,53,.2);font-weight:500}
.slabel{display:block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;color:#2e7d32}

#notruf-panel{display:none;background:#f1f8e9;border-top:2px solid #aed581;padding:12px 14px;flex-shrink:0}
#notruf-q{font-size:14px;color:#33691e;font-weight:700;margin-bottom:10px;line-height:1.4}
.nc-btn{display:block;width:100%;background:#2e7d32;color:#fff;border:none;border-radius:8px;padding:11px 14px;font-size:13px;font-weight:600;cursor:pointer;text-align:left;line-height:1.4;font-family:inherit;margin-bottom:7px}
.nc-btn:last-child{margin-bottom:0}
.nc-btn:active{opacity:.85}

#input-area{background:#fff;border-top:1px solid #cfd8dc;padding:10px 12px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
#user-input{flex:1;border:2px solid #cfd8dc;border-radius:10px;padding:10px 13px;font-size:16px;line-height:1.4;resize:none;outline:none;font-family:inherit;max-height:110px;min-height:44px;-webkit-appearance:none;background:#fafafa;transition:border-color .15s}
#user-input:focus{border-color:#0d1b4b;background:#fff}
#user-input:disabled{background:#f5f5f5;color:#9e9e9e}
#tipp-btn{background:#fff3e0;color:#e65100;border:2px solid #ffb74d;border-radius:10px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;height:44px;font-family:inherit;flex-shrink:0;white-space:nowrap}
#tipp-btn:active{background:#ffe0b2}
#tipp-btn:disabled{opacity:.4;cursor:default}
#send-btn{background:#0d1b4b;color:#fff;border:none;border-radius:10px;padding:0 18px;font-size:15px;font-weight:700;cursor:pointer;height:44px;min-width:72px;font-family:inherit;flex-shrink:0}
#send-btn:active{background:#1a2e72}
#send-btn:disabled{background:#b0bec5;cursor:default}
</style>
</head>

      {t:'Ansprechbar, klagt über Schmerzen am Bein',ok:false,
       f:'⚠️ Folge: Kein Notarzt wird angefordert, weil der Patient laut Meldung ansprechbar ist. Stefan ist jedoch bewusstlos – schildern Sie den tatsächlichen Zustand.'}]},
  {q:'Leitstelle: „Rettungswagen ist alarmiert. Bleiben Sie bitte in der Leitung."',
   a:[{t:'Verstanden – ich warte auf Rückfragen',ok:true},
      {t:'Ich lege auf, ich muss mich um den Verletzten kümmern',ok:false,
       f:'⚠️ Folge: Die Leitstelle verliert den Kontakt. Eine wichtige Rückfrage bleibt unbeantwortet – der Rettungsdienst trifft ohne aktuellen Lagebericht ein. Bleiben Sie in der Leitung.'},
      {t:'Bitte beeilen Sie sich, ich habe keine Zeit mehr',ok:false,
       f:'⚠️ Folge: Die Leitstelle kann Sie nicht für weitere Anweisungen erreichen. Im Notfall zählt Ruhe – der Rettungsdienst ist alarmiert, bleiben Sie in der Leitung.'}]}
];

/* ═══════════════════════════════════════════════════════════════
   HILFSFUNKTIONEN
═══════════════════════════════════════════════════════════════ */
const n   = s => s.toLowerCase().normalize('NFC');
const has = (t,kws) => kws.some(k => n(t).includes(n(k)));
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Nudge-Cycling-Zähler (getrennt von S)
const NC = {};
function cyc(key,arr){ NC[key]=(NC[key]||0); return arr[NC[key]++%arr.length]; }

function msg(html,cls='b-bot'){
  const el=document.createElement('div');
  el.className='bubble '+cls;
  el.innerHTML=html;
  document.getElementById('chat-area').appendChild(el);
  requestAnimationFrame(()=>document.getElementById('chat-area').scrollTop=9999);
}
function later(fn,ms=350){setTimeout(fn,ms)}
function lock(on){['user-input','send-btn','tipp-btn'].forEach(id=>
  document.getElementById(id).disabled=on)}

/* ═══════════════════════════════════════════════════════════════
   ERWARTETER SCHRITT  (für Tipp-Button)
═══════════════════════════════════════════════════════════════ */
function expected(){
  if(!S.s1)return 's1'; if(!S.s2)return 's2'; if(!S.s3)return 's3';
  if(!S.s4)return 's4'; if(!S.s5)return 's5';
  if(!S.s6)return 's6'; if(!S.s7)return 's7';
  if(!S.s8)return 's8'; if(!S.s9)return 's9';
  return null;
}

function showTipp(){
  const st=expected(); if(!st)return;
  const t=TIPP[st]; if(t) msg('💡 '+t,'b-bot');
}

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
function init(){
  document.getElementById('chat-area').innerHTML='';
  later(()=>msg(
    '<strong>Szenario – 14:30 Uhr, Lagerhalle LOGISTIXX GmbH</strong><br><br>'+
    'Es ist 14:30 Uhr. Plötzlich hören Sie ein dumpfes Geräusch. Sie drehen sich um: '+
    'Ihr Kollege <strong>Stefan K. (34)</strong> liegt reglos auf dem Boden. Ein Gabelstapler ist '+
    'rückwärts in ihn gefahren. Der Staplerfahrer hat das Fahrzeug gestoppt und steht schockiert '+
    'daneben. Stefans linkes Bein liegt in einer unnatürlichen Position, '+
    'am Hosenbein ist Blut zu sehen.<br><br>'+
    'Ihr <strong>Schichtleiter Herr Fischer</strong> ist zur Zeit in der Nachbarhalle.<br><br>'+
    '<strong>Was tun Sie als Erstes?</strong>'
  ),150);
}

/* ═══════════════════════════════════════════════════════════════
   EINGABE VERARBEITEN
═══════════════════════════════════════════════════════════════ */
function handleInput(){
  const el=document.getElementById('user-input');
  const raw=el.value.trim();
  if(!raw||S.done||S.notruf)return;
  el.value=''; el.style.height='auto';
  msg(esc(raw),'b-user');
  later(()=>process(raw));
}

/* ═══════════════════════════════════════════════════════════════
   FALSCHE HANDLUNGEN  (gefährliche Aktionen mit Konsequenz)
═══════════════════════════════════════════════════════════════ */
const WRONG_ACTIONS = [
  { kw:['schüttle','rüttle','wackel','klatsche stefan','schlag stefan','schlage stefan'],
    msg:'⚠️ Folge: Sie schütteln Stefan – bei einer möglichen Verletzung der Wirbelsäule könnten Sie so bleibende Schäden oder eine Lähmung verursachen. Bewusstlose Personen niemals stark schütteln!' },
  { kw:['gebe ihm wasser','gib ihm wasser','gebe ihm etwas zu trinken','gib ihm etwas','flüssigkeit geben','trinken lassen'],
    msg:'⚠️ Folge: Stefan ist bewusstlos. Flüssigkeit einzuflößen führt bei Bewusstlosen zu akuter Erstickungsgefahr – er kann nicht schlucken!' },
  { kw:['stelle ihn auf','stell ihn auf','richte ihn auf','helfe ihm aufzustehen','hilf ihm aufzustehen','setze ihn auf','setz ihn auf'],
    msg:'⚠️ Folge: Sie versuchen Stefan aufzurichten – er sackt sofort wieder zusammen und zieht Sie mit. Stürze und Verschlimmerung der Verletzungen sind die Folge.' },
  { kw:['verlasse den','verlasse stefan','gehe weg','geh weg','lasse ihn allein','lass ihn allein','laufe weg','renne weg'],
    msg:'⚠️ Folge: Sie verlassen Stefan – sein Zustand verschlechtert sich unbeobachtet. Eine bewusstlose Person darf niemals allein gelassen werden.' },
  { kw:['entferne den helm','nehme den helm ab','nimm den helm ab','ziehe den helm ab','zieh den helm ab'],
    msg:'⚠️ Folge: Den Helm eines Bewusstlosen zu entfernen kann eine Halswirbelverletzung massiv verschlimmern. Das ist ausschließlich Aufgabe des Rettungsdienstes.' }
];

function process(raw){
  const t=raw;

  /* ── Gefährliche Handlungen immer blockieren ────────────────── */
  for(const wa of WRONG_ACTIONS){
    if(has(t,wa.kw)){ msg(wa.msg,'b-konsequenz'); return; }
  }
  if(S.done) return;

  /* ── Erwarteter Schritt bestimmt, was erlaubt ist ───────────── */
  const exp=expected();
  if(!exp) return;

  /* Keyword-Mapping: s5 und s6 akzeptieren auch "erste hilfe" */
  const KM={
    s1:KW.s1, s2:KW.s2, s3:KW.s3, s4:KW.s4,
    s5:[...KW.s5,'erste hilfe','ersthelfer','erste-hilfe'],
    s6:[...KW.s6,'erste hilfe','ersthelfer','erste-hilfe'],
    s7:KW.s7, s8:KW.s8, s9:KW.s9
  };
  const ORD=['s1','s2','s3','s4','s5','s6','s7','s8','s9'];
  const ei=ORD.indexOf(exp);

  /* ── Eingabe trifft genau den erwarteten Schritt → ausführen ─ */
  if(has(t,KM[exp])){ doStep(exp); return; }

  /* ── Eingabe trifft einen anderen Schritt ────────────────────── */
  for(const s of ORD){
    if(s===exp||!has(t,KM[s])) continue;
    if(ORD.indexOf(s)<ei)
      msg('Das haben Sie bereits erledigt. Was ist jetzt als Nächstes zu tun?','b-bot');
    else
      msg(skipMsg(exp),'b-konsequenz');
    return;
  }

  /* ── Fallback ────────────────────────────────────────────────── */
  const FB=['Das habe ich nicht ganz verstanden. Wie meinen Sie das?',
            'Überlegen Sie nochmal, was jetzt die richtige Maßnahme ist.',
            'Was genau meinen Sie damit? Beschreiben Sie Ihren nächsten Schritt etwas genauer.'];
  msg(FB[S.fallback++%FB.length],'b-bot');
}

/* Konsequenz-Nachricht: was passiert, weil Schritt <missing> fehlt */
function skipMsg(missing){
  if(missing==='s1') return cyc('s1',NUDGE.s1);
  if(missing==='s2') return cyc('s2p',NUDGE.s2_prereq);
  if(missing==='s3') return cyc('s3f',NUDGE.s3_for_s4);
  if(missing==='s4') return '⚠️ Folge: Stefan liegt auf dem Boden – kein Rettungsdienst ist alarmiert. Wer soll die professionelle Behandlung übernehmen?';
  if(missing==='s5') return cyc('s6p',NUDGE.s6_prereq);
  if(missing==='s6') return '⚠️ Folge: Ihr Kollege wartet am Eingang – Stefan liegt allein auf dem Boden. Niemand beobachtet seinen Zustand.';
  if(missing==='s7') return '⚠️ Folge: Herr Fischer koordiniert – aber der Rettungswagen findet den Eingang nicht. Wertvolle Minuten gehen verloren.';
  if(missing==='s8') return '⚠️ Folge: Die Dokumentation wartet – Stefan liegt noch immer in der Halle.';
  return 'Überlegen Sie nochmal, was jetzt die richtige Maßnahme ist.';
}

/* Schritt ausführen */
function doStep(s){
  switch(s){
    case 's1':
      S.s1=1;
      msg('<span class="slabel">✔ Schritt 1 – Eigenschutz &amp; Überblick</span>'+
          'Sie verschaffen sich einen Überblick: Der Gabelstapler steht still, der Fahrer hat '+
          'das Fahrzeug gesichert. Die Umgebung ist ruhig – Sie sind in Sicherheit.','b-ok');
      later(()=>msg(FOLLOWUP.s1,'b-bot'),900); break;
    case 's2':
      S.s2=1;
      msg('<span class="slabel">✔ Schritt 2 – Bereich absichern</span>'+
          'Sie sichern den Unfallbereich ab und bitten Kollegen um Hilfe. Niemand darf mehr in '+
          'den Bereich einfahren oder eintreten.','b-ok');
      later(()=>msg(FOLLOWUP.s2,'b-bot'),900); break;
    case 's3':
      S.s3=1;
      msg('<span class="slabel">✔ Schritt 3 – Zustand prüfen</span>'+
          'Sie sprechen Stefan laut an – keine Reaktion. Atmung ist hörbar und regelmäßig. '+
          'Schwellung am linken Bein sichtbar.','b-ok');
      later(()=>msg(FOLLOWUP.s3,'b-bot'),900); break;
    case 's4':
      startNotruf(); break;
    case 's5':
      S.s5=1;
      msg('<span class="slabel">✔ Schritt 5 – Stabile Seitenlage</span>'+
          'Stefan liegt in der stabilen Seitenlage. Die Atemwege sind frei – er atmet weiterhin regelmäßig.','b-ok');
      later(()=>fischerCheck(FOLLOWUP.s5),900); break;
    case 's6':
      S.s6=1;
      msg('<span class="slabel">✔ Schritt 6 – Betreuen &amp; Beobachten</span>'+
          'Sie bleiben bei Stefan, sprechen beruhigend auf ihn ein und beobachten seine Atmung. '+
          'Nach ca. 8 Minuten ist eine Sirene zu hören.','b-ok');
      later(()=>fischerCheck(FOLLOWUP.s6),900); break;
    case 's7':
      S.s7=1;
      msg('<span class="slabel">✔ Schritt 7 – Rettungsdienst einweisen</span>'+
          'Ein Kollege eilt zum Haupteingang. Die Sanitäter treffen mit Trage und Ausrüstung ein.','b-ok');
      later(()=>fischerCheck(FOLLOWUP.s7),900); break;
    case 's8':
      S.s8=1;
      msg('<span class="slabel">✔ Schritt 8 – Vorgesetzten informieren</span>'+
          'Schichtleiter Fischer wurde informiert. Er sichert den Bereich und koordiniert die weiteren Maßnahmen.','b-ok');
      later(()=>fischerCheck(FOLLOWUP.s8),900); break;
    case 's9':
      S.s9=1;
      msg('<span class="slabel">✔ Schritt 9 – Dokumentation</span>'+
          'Die Unfallanzeige wurde ausgefüllt und an Schichtleiter Fischer weitergegeben. '+
          'Der Vorfall ist ordnungsgemäß im Verbandbuch dokumentiert.','b-ok');
      later(()=>checkDone(),900); break;
  }
}

/* ═══════════════════════════════════════════════════════════════
   NOTRUF
═══════════════════════════════════════════════════════════════ */
function startNotruf(){
  S.notruf=true; S.nStep=0;
  document.getElementById('notruf-banner').style.display='block';
  document.getElementById('notruf-panel').style.display='block';
  lock(true);
  msg('📞 Sie wählen die <strong>112</strong>. Die Leitstelle nimmt ab…','b-bot');
  later(()=>renderNQ(),700);
}

function renderNQ(){
  const q=NQ[S.nStep];
  document.getElementById('notruf-q').innerHTML=q.q;
  const box=document.getElementById('notruf-choices');
  box.innerHTML='';
  [...q.a].sort(()=>Math.random()-.5).forEach(a=>{
    const b=document.createElement('button');
    b.className='nc-btn'; b.textContent=a.t;
    b.onclick=()=>pickNQ(a);
    box.appendChild(b);
  });
}

function pickNQ(a){
  msg('📞 '+esc(a.t),'b-user');
  if(a.ok){
    later(()=>{
      if(S.nStep<NQ.length-1){ S.nStep++; renderNQ(); }
      else{
        msg('Leitstelle: <em>„Rettungswagen ist alarmiert. Fahrzeit ca. 9 Minuten. '+
            'Bleiben Sie bitte in der Leitung, falls möglich."</em><br>— <em>Verbindung getrennt.</em>','b-bot');
        S.s4=1; S.notruf=false;
        document.getElementById('notruf-banner').style.display='none';
        document.getElementById('notruf-panel').style.display='none';
        lock(false);
        later(()=>{
          msg('<span class="slabel">✔ Schritt 4 – Notruf 112</span>Notruf erfolgreich abgesetzt.','b-ok');
          later(()=>msg('Was tun Sie als Nächstes?','b-bot'),700);
        },500);
      }
    },400);
  } else {
    later(()=>msg(a.f,'b-konsequenz'),300);
  }
}

/* ═══════════════════════════════════════════════════════════════
   FISCHER-HINWEIS & ABSCHLUSS
═══════════════════════════════════════════════════════════════ */
function fischerCheck(followupText){
  // Follow-up anzeigen
  later(()=>msg(followupText,'b-bot'),900);
  // Fischer-Hinweis wenn S1-S8 done aber S9 fehlt
  const main=S.s1&&S.s2&&S.s3&&S.s4&&S.s5&&S.s6&&S.s7&&S.s8;
  if(main&&!S.s9&&!S.done)
    later(()=>msg('Herr Fischer fragt Sie: <em>„Ist der Unfall schon dokumentiert? '+
                  'Unfallanzeige und Verbandbuch müssen ausgefüllt werden."</em>','b-bot'),1600);
  checkDone();
}

function checkDone(){
  if(S.done)return;
  if(!(S.s1&&S.s2&&S.s3&&S.s4&&S.s5&&S.s6&&S.s7&&S.s8&&S.s9))return;
  S.done=true;
  later(()=>{
    document.getElementById('badge').textContent='ABGESCHLOSSEN';
    document.getElementById('badge').style.background='#2e7d32';
    msg('<strong>Simulation erfolgreich abgeschlossen!</strong><br><br>'+
        'Alle Handlungsschritte korrekt durchgeführt:<br><br>'+
        '&nbsp;✔ Schritt 1 – Eigenschutz &amp; Überblick<br>'+
        '&nbsp;✔ Schritt 2 – Bereich absichern<br>'+
        '&nbsp;✔ Schritt 3 – Zustand prüfen<br>'+
        '&nbsp;✔ Schritt 4 – Notruf 112<br>'+
        '&nbsp;✔ Schritt 5 – Stabile Seitenlage<br>'+
        '&nbsp;✔ Schritt 6 – Betreuen &amp; Beobachten<br>'+
        '&nbsp;✔ Schritt 7 – Rettungsdienst einweisen<br>'+
        '&nbsp;✔ Schritt 8 – Vorgesetzten informieren<br>'+
        '&nbsp;✔ Schritt 9 – Dokumentation<br><br>'+
        'Stefan K. wurde vom Rettungsdienst versorgt und ins Krankenhaus transportiert. '+
        '<strong>Sehr gut gemacht!</strong><br><br>'+
        '<em>↺ Neu starten zum Wiederholen</em>','b-ok');
    lock(true);
    document.getElementById('user-input').placeholder='Simulation beendet – ↺ Neu starten';
  },700);
}

/* ═══════════════════════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════════════════════ */
function restart(){
  Object.assign(S,{s1:0,s2:0,s3:0,s4:0,s5:0,s6:0,s7:0,s8:0,s9:0,
                   notruf:false,nStep:0,done:false,fallback:0});
  Object.keys(NC).forEach(k=>NC[k]=0);
  document.getElementById('notruf-banner').style.display='none';
  document.getElementById('notruf-panel').style.display='none';
  lock(false);
  document.getElementById('user-input').placeholder='Was tun Sie? Hier schreiben…';
  document.getElementById('user-input').value='';
  document.getElementById('badge').textContent='UNFALL AKTIV';
  document.getElementById('badge').style.background='#c62828';
  init();
}

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,110)+'px'}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey){e.preventDefault();handleInput()}}

init();
</script>
